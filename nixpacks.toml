# Railway / Nixpacks build configuration for the Captor Laravel backend.
# Demo-grade: uses `php artisan serve` (single-process) instead of a full
# nginx + php-fpm stack. Fine for client demos, not for production traffic.

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link || true && php artisan serve --host=0.0.0.0 --port=$PORT"
